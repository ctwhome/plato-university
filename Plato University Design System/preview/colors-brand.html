<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
.grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
.swatch { height: 96px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; }
.swatch .name { font-family: var(--font-sans); font-size: 12px; font-weight: 600; }
.swatch .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.75; margin-top: 2px; }
.swatch.cream { background: var(--cream); color: var(--ink); border: 1px solid var(--rule-soft); }
.swatch.ink { background: var(--ink); color: var(--cream); }
.swatch.olive { background: var(--olive); color: var(--cream); }
.swatch.terra { background: var(--terracotta); color: var(--cream); }
</style></head>
<body>
<div class="grid">
  <div class="swatch cream"><span class="name">Cream</span><span class="hex">#FAF7F2 · --cream</span></div>
  <div class="swatch ink"><span class="name">Ink</span><span class="hex">#1A1A1A · --ink</span></div>
  <div class="swatch olive"><span class="name">Olive</span><span class="hex">#6B7A4F · --olive</span></div>
  <div class="swatch terra"><span class="name">Terracotta</span><span class="hex">#B8593A · --terracotta</span></div>
</div>
</body></html>
