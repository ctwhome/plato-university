<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
body { padding: 22px 28px; }
.tl { margin: 0; padding: 0; list-style: none; }
.tl li { position: relative; padding-left: 28px; padding-bottom: 18px; border-left: 1px solid rgba(26,26,26,0.15); }
.tl li:last-child { border-left-color: rgba(26,26,26,0.1); padding-bottom: 0; }
.tl .dot { position: absolute; left: -5px; top: 4px; width: 9px; height: 9px; border-radius: 50%; }
.t { background: var(--terracotta); }
.o { background: var(--olive); }
.oo { background: rgba(107,122,79,0.4); }
.g { background: rgba(26,26,26,0.15); }
.eb { font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.2em; font-size: 9.5px; margin-bottom: 2px; }
.eb.t { color: var(--terracotta); background: transparent; }
.eb.o { color: var(--olive); background: transparent; }
.eb.d { color: rgba(26,26,26,0.35); background: transparent; }
h4 { font-family: var(--font-serif); font-weight: 500; font-size: 18px; margin: 0; }
h4.d { color: rgba(26,26,26,0.45); }
</style></head>
<body>
<ol class="tl">
<li><span class="dot t"></span><div class="eb t">Sep 2026 · Now</div><h4>The discovery month</h4></li>
<li><span class="dot o"></span><div class="eb o">2027</div><h4>The six-month pilot</h4></li>
<li><span class="dot oo"></span><div class="eb d">2028</div><h4 class="d">The one-year academy</h4></li>
<li><span class="dot g"></span><div class="eb d">Long term</div><h4 class="d">A three-year university</h4></li>
</ol>
</body></html>
