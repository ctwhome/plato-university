<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
.grid { display: flex; gap: 14px; align-items: flex-end; }
.box { background: var(--cream-2); border: 1px solid var(--rule-softer); width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
.lab { font-family: var(--font-sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-4); margin-top: 6px; text-align: center; }
.col { display: flex; flex-direction: column; align-items: center; }
.val { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); margin-top: 2px; }
</style></head>
<body>
<div class="grid">
<div class="col"><div class="box" style="border-radius:4px">0.25</div><div class="lab">Field</div><div class="val">buttons, inputs</div></div>
<div class="col"><div class="box" style="border-radius:8px">0.5</div><div class="lab">Box</div><div class="val">default cards</div></div>
<div class="col"><div class="box" style="border-radius:16px">1</div><div class="lab">Lg</div><div class="val">nav chips</div></div>
<div class="col"><div class="box" style="border-radius:24px">1.5</div><div class="lab">Xl</div><div class="val">featured card</div></div>
<div class="col"><div class="box" style="border-radius:9999px">pill</div><div class="lab">Pill</div><div class="val">radio, dots</div></div>
</div>
</body></html>
