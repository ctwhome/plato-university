<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
body { padding: 0; background: var(--cream); }
nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; }
.brand { font-family: var(--font-serif); font-weight: 500; font-size: 26px; letter-spacing: -0.01em; }
.brand em { font-style: italic; color: var(--olive); }
.apply { font-family: var(--font-sans); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.18em; padding: 8px 14px; border-radius: 4px; background: transparent; color: var(--ink); border: 0; cursor: pointer; }
.apply:hover { background: rgba(26,26,26,0.06); }
.hairline { height: 1px; background: rgba(26,26,26,0.18); margin: 0 32px; }
.hero { padding: 26px 32px 24px; }
.eb { font-family: var(--font-sans); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.2em; color: var(--olive); margin-bottom: 10px; }
h1 { font-family: var(--font-serif); font-weight: 500; font-size: 38px; line-height: 1.05; letter-spacing: -0.01em; margin: 0; }
h1 em { color: var(--terracotta); }
</style></head>
<body>
<nav><div class="brand">Plato <em>University</em></div><button class="apply">Apply</button></nav>
<div class="hairline"></div>
<div class="hero">
  <div class="eb">Discovery month · Sep 2026 · Amsterdam</div>
  <h1>The world doesn't need more specialists.<br>It needs <em>thinkers.</em></h1>
</div>
</body></html>
