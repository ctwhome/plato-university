<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
body { padding: 22px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch; }
.card { padding: 20px 22px; border-radius: 8px; background: rgba(242,237,227,0.6); border: 1px solid rgba(26,26,26,0.1); }
.card .eb { font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.2em; font-size: 10px; color: var(--terracotta); margin-bottom: 6px; }
.card h3 { font-family: var(--font-serif); font-weight: 500; font-size: 24px; margin: 0 0 4px; }
.card .it { font-family: var(--font-serif); font-style: italic; color: var(--fg-3); font-size: 14px; margin: 0 0 10px; }
.card ul { font-family: var(--font-sans); font-size: 12px; line-height: 1.55; color: var(--fg-2); margin: 0; padding-left: 16px; }
.feat { background: #fff; border: 1px solid rgba(26,26,26,0.06); border-radius: 18px; padding: 22px 24px; box-shadow: 0 4px 40px rgba(26,26,26,0.08), 0 1px 4px rgba(26,26,26,0.04); }
.feat .eb { color: var(--terracotta); font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.2em; font-size: 10px; margin-bottom: 8px; }
.feat h3 { font-family: var(--font-serif); font-size: 24px; font-weight: 500; line-height: 1.2; margin: 0; }
</style></head>
<body>
<div class="row">
  <div class="card">
    <div class="eb">Trimester 1</div>
    <h3>Foundations</h3>
    <div class="it">You learn to think.</div>
    <ul><li>Socratic method &amp; logic</li><li>Rhetoric and writing</li><li>Plato, Seneca, Montaigne</li></ul>
  </div>
  <div class="feat">
    <div class="eb">The problem</div>
    <h3>Still running a school built for the factory floor.</h3>
  </div>
</div>
</body></html>
