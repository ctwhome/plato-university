<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
body { padding: 26px 28px; background: var(--cream); }
.prose { font-family: var(--font-serif); font-size: 19px; line-height: 1.55; color: rgba(26,26,26,0.85); max-width: 560px; }
.annotated { text-decoration: underline; text-decoration-style: dotted; text-decoration-color: var(--terracotta); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; white-space: nowrap; }
.card { position: relative; margin-top: 14px; width: 310px; background: var(--cream); border: 1px solid rgba(26,26,26,0.15); border-radius: 6px; box-shadow: 0 4px 20px rgba(26,26,26,0.13), 0 1px 4px rgba(26,26,26,0.08); padding: 12px 14px; }
.card .n { font-family: var(--font-serif); font-weight: 700; font-size: 18px; line-height: 1.2; }
.card .d { font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.05em; color: rgba(26,26,26,0.6); margin: 2px 0 6px; text-transform: uppercase; }
.card .p { font-family: var(--font-sans); font-size: 12px; line-height: 1.55; color: rgba(26,26,26,0.82); margin: 0; }
</style></head>
<body>
<p class="prose">In 1843, <span class="annotated">Horace Mann</span> brought the Prussian bell home. <span class="annotated">Carnegie</span> then turned learning into a stopwatch.</p>
<div class="card">
  <div class="n">Horace Mann</div>
  <div class="d">1796–1859</div>
  <p class="p">US Secretary of Education for Massachusetts who studied Prussian schools in 1843 and brought their age-graded, bell-scheduled model home.</p>
</div>
</body></html>
