<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
.row { display: grid; grid-template-columns: 90px 1fr; gap: 16px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule-softer); }
.tag { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); }
.h1 { font-family: var(--font-serif); font-weight: 500; font-size: 44px; line-height: 1.1; letter-spacing: -0.01em; }
.h2 { font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 1.1; }
.h3 { font-family: var(--font-serif); font-weight: 500; font-size: 22px; line-height: 1.2; }
.h4 { font-family: var(--font-serif); font-weight: 600; font-size: 18px; }
</style></head>
<body>
<div class="row"><div class="tag">H1 · 48</div><div class="h1">Three trimesters.</div></div>
<div class="row"><div class="tag">H2 · 32</div><div class="h2">The world as it is</div></div>
<div class="row"><div class="tag">H3 · 22</div><div class="h3">Foundations</div></div>
<div class="row" style="border:0"><div class="tag">H4 · 18</div><div class="h4">Socratic method</div></div>
</body></html>
