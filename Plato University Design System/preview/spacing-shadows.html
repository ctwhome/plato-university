<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
body { padding: 32px; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.card { background: #fff; border: 1px solid rgba(26,26,26,0.06); border-radius: 12px; height: 88px; display: flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-size: 11px; color: var(--fg-3); }
.card.sm { box-shadow: 0 1px 2px rgba(26,26,26,0.06); }
.card.cd { box-shadow: 0 4px 40px rgba(26,26,26,0.08), 0 1px 4px rgba(26,26,26,0.04); border-radius: 18px; }
.card.tp { box-shadow: 0 4px 20px rgba(26,26,26,0.13), 0 1px 4px rgba(26,26,26,0.08); border-radius: 6px; }
.lab { font-family: var(--font-sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-4); margin-top: 10px; text-align: center; }
.spec { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-4); text-align: center; margin-top: 4px; }
</style></head>
<body>
<div class="row">
<div><div class="card sm">sm</div><div class="lab">Flat</div><div class="spec">0 1px 2px / .06</div></div>
<div><div class="card cd">card</div><div class="lab">Card (featured)</div><div class="spec">0 4px 40px / .08 + 1px</div></div>
<div><div class="card tp">tip</div><div class="lab">Tooltip</div><div class="spec">0 4px 20px / .13 + 1px</div></div>
</div>
</body></html>
