<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 60px 80px 1fr; align-items: center; gap: 12px; font-family: var(--font-sans); font-size: 11px; }
.bar { height: 14px; background: var(--terracotta); opacity: 0.85; border-radius: 2px; }
.tok { font-family: var(--font-mono); color: var(--fg-3); }
</style></head>
<body>
<div class="rows">
<div class="row"><b>4px</b><span class="tok">--space-1</span><div class="bar" style="width:4px"></div></div>
<div class="row"><b>8px</b><span class="tok">--space-2</span><div class="bar" style="width:8px"></div></div>
<div class="row"><b>12px</b><span class="tok">--space-3</span><div class="bar" style="width:12px"></div></div>
<div class="row"><b>16px</b><span class="tok">--space-4</span><div class="bar" style="width:16px"></div></div>
<div class="row"><b>24px</b><span class="tok">--space-5</span><div class="bar" style="width:24px"></div></div>
<div class="row"><b>32px</b><span class="tok">--space-6</span><div class="bar" style="width:32px"></div></div>
<div class="row"><b>48px</b><span class="tok">--space-7</span><div class="bar" style="width:48px"></div></div>
<div class="row"><b>64px</b><span class="tok">--space-8</span><div class="bar" style="width:64px"></div></div>
<div class="row"><b>96px</b><span class="tok">--space-9</span><div class="bar" style="width:96px"></div></div>
</div>
</body></html>
