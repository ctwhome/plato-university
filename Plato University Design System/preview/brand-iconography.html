<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
body { padding: 22px 26px; }
.section { margin-bottom: 14px; }
.lab { font-family: var(--font-sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-4); margin-bottom: 8px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--font-sans); font-size: 14px; color: rgba(26,26,26,0.82); }
ul li { display: flex; gap: 12px; align-items: center; }
.arrow { color: var(--olive); width: 14px; display: inline-block; }
.dots { display: flex; gap: 8px; align-items: center; }
.d { width: 10px; height: 10px; border-radius: 50%; }
.note { font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--fg-3); margin-top: 10px; }
</style></head>
<body>
<div class="section"><div class="lab">Arrow bullet</div>
  <ul><li><span class="arrow">→</span> Primary sources, not summaries</li><li><span class="arrow">→</span> All ages, all edges</li></ul>
</div>
<div class="section"><div class="lab">Timeline dots</div>
  <div class="dots"><span class="d" style="background:var(--terracotta)"></span>now <span class="d" style="background:var(--olive)"></span>next <span class="d" style="background:rgba(107,122,79,0.4)"></span>after <span class="d" style="background:rgba(26,26,26,0.15)"></span>later</div>
</div>
<div class="note">No icon font. No emoji. No SVG icon library. Arrows, dots, typographic marks only.</div>
</body></html>
